# Edge proxy for Docker Compose. Plays the role the Ingress plays in
# Kubernetes: one public origin, path-based routing to the services.
# Keep the rules in step with deploy/helm/cka-lab/templates/ingress.yaml.

# Docker's embedded DNS. Resolving per request (via variables) means a
# restarted container with a new IP is picked up without reloading nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 1m;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 60s;

    location /api/identity/ {
        set $identity http://ms-identity:3001;
        proxy_pass $identity;
    }

    location /api/learning/ {
        set $learning http://ms-learning:3002;
        proxy_pass $learning;
    }

    # Anything else under /api is not a real route: answer here instead of
    # letting the SPA return its HTML shell with a 200.
    location /api/ {
        default_type application/json;
        return 404 '{"statusCode":404,"message":"Not found"}';
    }

    location / {
        set $web http://web:8080;
        proxy_pass $web;
    }
}
