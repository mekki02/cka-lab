# Source: cka-lab/templates/postgresql.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cka-lab-postgresql
  labels:
    app.kubernetes.io/part-of: cka-lab
    app.kubernetes.io/instance: cka-lab
    app.kubernetes.io/version: "0.1.0"
spec:
  serviceName: cka-lab-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: cka-lab
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: cka-lab
        app.kubernetes.io/instance: cka-lab
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/name: postgresql
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70        # the "postgres" user of the alpine image
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      # Postgres needs time to flush and shut down cleanly on SIGTERM.
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgresql
          image: postgres:17-alpine
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: cka-lab-postgresql, key: postgres-password } }
            - name: IDENTITY_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: cka-lab-postgresql, key: identity-password } }
            - name: LEARNING_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: cka-lab-postgresql, key: learning-password } }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"] }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - name: init
          configMap: { name: cka-lab-postgresql-init, defaultMode: 0555 }
        - name: run
          emptyDir: {}
  # The data lives in a PersistentVolumeClaim, not in the container: it
  # survives Pod restarts, rescheduling and chart upgrades.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

