    app.kubernetes.io/part-of: cka-lab
    app.kubernetes.io/instance: cka-lab
    app.kubernetes.io/version: "0.1.0"
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["cka.example.com"]
      secretName: cka-lab-tls
  rules:
    - host: "cka.example.com"
      http:
        paths:
          - path: /api/identity
            pathType: Prefix
            backend: { service: { name: cka-lab-ms-identity, port: { name: http } } }
          - path: /api/learning
            pathType: Prefix
            backend: { service: { name: cka-lab-ms-learning, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: cka-lab-web, port: { name: http } } }
