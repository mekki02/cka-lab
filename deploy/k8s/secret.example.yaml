# EXAMPLE ONLY — never commit real values.
#
# Create the Secrets imperatively instead of editing this file, so no secret
# ever lands in git or shell history files:
#
#   kubectl create namespace cka-lab
#   kubectl -n cka-lab create secret generic cka-lab-postgresql \
#     --from-literal=postgres-password="$(openssl rand -base64 32)" \
#     --from-literal=identity-password="$(openssl rand -base64 32)" \
#     --from-literal=learning-password="$(openssl rand -base64 32)"
#   node scripts/generate-jwt-keys.mjs > jwt.pem
#   kubectl -n cka-lab create secret generic cka-lab-jwt --from-file=jwt-private-key.pem=jwt.pem && rm jwt.pem
#
# The shapes below document which keys each Secret must contain.
apiVersion: v1
kind: Secret
metadata:
  name: cka-lab-postgresql
  namespace: cka-lab
type: Opaque
stringData:
  postgres-password: CHANGE_ME
  identity-password: CHANGE_ME
  learning-password: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: cka-lab-jwt
  namespace: cka-lab
type: Opaque
stringData:
  jwt-private-key.pem: |
    -----BEGIN PRIVATE KEY-----
    (Ed25519 PKCS#8 key from scripts/generate-jwt-keys.mjs)
    -----END PRIVATE KEY-----
---
# TLS certificate for the Ingress. Normally created by cert-manager.
apiVersion: v1
kind: Secret
metadata:
  name: cka-lab-tls
  namespace: cka-lab
type: kubernetes.io/tls
stringData:
  tls.crt: CHANGE_ME
  tls.key: CHANGE_ME
