{{- $fullname := include "cka.fullname" . -}}
{{- /*
Path routing — the same rules as deploy/compose/edge.conf:
  /api/identity/* -> ms-identity    /api/learning/* -> ms-learning    /* -> web
Health and JWKS endpoints live outside /api, so they are never exposed.
*/ -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels: {{- include "cka.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api/identity
            pathType: Prefix
            backend: { service: { name: {{ $fullname }}-ms-identity, port: { name: http } } }
          - path: /api/learning
            pathType: Prefix
            backend: { service: { name: {{ $fullname }}-ms-learning, port: { name: http } } }
          {{- if .Values.labs.enabled }}
          # REST and the terminal WebSocket (Ingress controllers pass upgrades through).
          - path: /api/labs
            pathType: Prefix
            backend: { service: { name: {{ $fullname }}-ms-labs, port: { name: http } } }
          {{- end }}
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ $fullname }}-web, port: { name: http } } }
{{- end }}
{{- if .Values.gateway.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}
  labels: {{- include "cka.labels" . | nindent 4 }}
spec:
  parentRefs: {{- required "gateway.parentRefs is required when gateway.enabled" .Values.gateway.parentRefs | toYaml | nindent 4 }}
  {{- with .Values.gateway.hostnames }}
  hostnames: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api/identity } }]
      backendRefs: [{ name: {{ $fullname }}-ms-identity, port: 3001 }]
    - matches: [{ path: { type: PathPrefix, value: /api/learning } }]
      backendRefs: [{ name: {{ $fullname }}-ms-learning, port: 3002 }]
    {{- if .Values.labs.enabled }}
    - matches: [{ path: { type: PathPrefix, value: /api/labs } }]
      backendRefs: [{ name: {{ $fullname }}-ms-labs, port: 3003 }]
    {{- end }}
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: {{ $fullname }}-web, port: 8080 }]
{{- end }}
