{{- /*
Generated secrets. `lookup` reads the existing Secret on upgrade so random
values are created once and then kept — regenerating the DB passwords would
lock the services out of an already-initialised database, and a new JWT key
would sign everyone out.

`lookup` returns nothing under `helm template` and some GitOps tools (Argo CD
renders with `helm template`). There, set postgresql.existingSecret and
jwt.existingSecret instead — see docs/DEPLOYMENT.md.
*/ -}}
{{- $fullname := include "cka.fullname" . -}}

{{- if and .Values.postgresql.enabled (not .Values.postgresql.existingSecret) }}
{{- $name := printf "%s-postgresql" $fullname }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "cka.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # survive `helm uninstall`: the data volume does too
type: Opaque
data:
  postgres-password: {{ get $existing "postgres-password" | default (randAlphaNum 32 | b64enc) }}
  identity-password: {{ get $existing "identity-password" | default (randAlphaNum 32 | b64enc) }}
  learning-password: {{ get $existing "learning-password" | default (randAlphaNum 32 | b64enc) }}
---
{{- end }}

{{- if not .Values.jwt.existingSecret }}
{{- $name := printf "%s-jwt" $fullname }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "cka.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  jwt-private-key.pem: {{ get $existing "jwt-private-key.pem" | default (genPrivateKey "ed25519" | b64enc) }}
{{- end }}
