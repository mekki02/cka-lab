id: ckad-ex-first-pod
title: "Three Pods, three statuses"
module: ckad-first-steps
lesson: ckad-first-pod
kind: exercise
difficulty: beginner
minutes: 10
order: 1
tags: [pods, logs, restartPolicy]
namespaces: [ex-pods]
setup: |
  kubectl -n ex-pods run api --image=nginx:1.277
  kubectl -n ex-pods run crasher --image=busybox:1.36 -- sh -c 'echo "loading config"; echo "fatal: $(echo REJfVVJM | base64 -d) is not set" >&2; exit 3'
statement: |
  In namespace `ex-pods`:

  1. Pod `api` should serve nginx, but it never starts. Find out why (`k -n ex-pods describe pod api`) and
     fix it so that it is **Running** with image `nginx:1.27`.
  2. Pod `crasher` keeps restarting. Read the logs of the attempt that **crashed** and answer: which
     environment variable is missing, and with which exit code does the container stop?
  3. Create a Pod `greeter`, image `busybox:1.36`, that prints `hello ckad` once and then stays
     **Completed** (it must not restart).
inputs:
  - id: missing-var
    label: The environment variable crasher complains about
    placeholder: NAME
  - id: exit-code
    label: The exit code of crasher's container
    placeholder: a number
checks:
  - id: api-running
    description: api runs nginx:1.27 and is Running
    type: cluster
    command: kubectl -n ex-pods get pod api -o jsonpath='{.spec.containers[0].image} {.status.phase}'
    expect: nginx:1.27 Running
    match: exact
  - id: missing-var
    description: You read the crashed attempt's error
    type: answer
    input: missing-var
    expect: DB_URL
  - id: exit-code
    description: You found the exit code
    type: answer
    input: exit-code
    expect: "3"
    match: number
  - id: greeter-done
    description: greeter completed without restarting
    type: cluster
    command: kubectl -n ex-pods get pod greeter -o jsonpath='{.spec.restartPolicy} {.status.phase}'
    expect: Never Succeeded
    match: exact
  - id: greeter-says
    description: greeter printed hello ckad
    type: cluster
    command: kubectl -n ex-pods logs greeter
    expect: hello ckad
    match: contains
hints:
  - "`describe` ends with the Events: look for `Failed to pull image`. `k set image pod/api api=nginx:1.27` changes the image in place."
  - "`k -n ex-pods logs crasher --previous` shows the crashed attempt. The exit code is in `describe` under *Last State*."
  - "Without `--restart=Never`, a Pod whose command exits is restarted — even with exit code 0."
solution: |
  ```bash
  k -n ex-pods describe pod api | tail -5          # nginx:1.277 not found
  k -n ex-pods set image pod/api api=nginx:1.27

  k -n ex-pods logs crasher --previous             # fatal: DB_URL is not set
  k -n ex-pods get pod crasher -o jsonpath='{.status.containerStatuses[0].lastState.terminated.exitCode}'   # 3

  k -n ex-pods run greeter --image=busybox:1.36 --restart=Never -- echo hello ckad
  ```
autotest:
  solve: |
    kubectl -n ex-pods set image pod/api api=nginx:1.27
    kubectl -n ex-pods run greeter --image=busybox:1.36 --restart=Never -- echo hello ckad
    kubectl -n ex-pods wait --for=condition=Ready pod/api --timeout=120s
    kubectl -n ex-pods wait --for=jsonpath='{.status.phase}'=Succeeded pod/greeter --timeout=120s
  answers:
    missing-var: DB_URL
    exit-code: "3"
