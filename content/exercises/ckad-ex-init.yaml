id: ckad-ex-init
title: "Wait, then prepare: init containers"
module: ckad-multi-container
lesson: ckad-init-containers
kind: exercise
difficulty: beginner
minutes: 12
order: 1
tags: [initContainers, emptyDir]
namespaces: [ex-init]
setup: |
  cat <<'YAML' | kubectl apply -f -
  apiVersion: v1
  kind: Pod
  metadata:
    name: app
    namespace: ex-init
  spec:
    initContainers:
    - name: wait-for-deps
      image: busybox:1.36
      command: ["sh", "-c", "until nslookup payments-db.ex-init.svc.cluster.local >/dev/null 2>&1; do echo 'waiting for payments-db'; sleep 2; done"]
    containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
  YAML
statement: |
  In namespace `ex-init`:

  1. Pod `app` has been stuck in `Init:0/1` for a while. Find out **what it is waiting for** (read the init
     container's logs), and unblock it **without changing the Pod**: create what it needs as a ClusterIP
     Service on port 5432. `app` must end up Running.
  2. Create a Pod `site` that serves a page prepared at start-up:
     - an init container `fetch` (`busybox:1.36`) writes the text `welcome to ckad` into
       `index.html` on an `emptyDir` volume named `html`;
     - the container `web` (`nginx:1.27`) mounts that volume at `/usr/share/nginx/html`.
checks:
  - id: app-running
    description: app is Running (its init container completed)
    type: cluster
    command: kubectl -n ex-init get pod app -o jsonpath='{.status.initContainerStatuses[0].state.terminated.reason} {.status.phase}'
    expect: Completed Running
    match: exact
  - id: service
    description: The Service app waits for exists, on port 5432
    type: cluster
    command: kubectl -n ex-init get svc payments-db -o jsonpath='{.spec.ports[0].port}'
    expect: "5432"
    match: number
  - id: site-init
    description: site has an init container fetch and a container web (nginx:1.27)
    type: cluster
    command: kubectl -n ex-init get pod site -o jsonpath='{.spec.initContainers[0].name} {.spec.containers[0].name} {.spec.containers[0].image}'
    expect: fetch web nginx:1.27
    match: exact
  - id: site-volume
    description: The volume html is an emptyDir mounted by web at /usr/share/nginx/html
    type: cluster
    command: kubectl -n ex-init get pod site -o jsonpath='{.spec.volumes[?(@.name=="html")].emptyDir}|{.spec.containers[0].volumeMounts[?(@.name=="html")].mountPath}'
    expect: '^\{.*\}\|/usr/share/nginx/html$'
    match: regex
  - id: site-serves
    description: nginx serves "welcome to ckad"
    type: cluster
    command: kubectl -n ex-init exec site -c web -- curl -s localhost
    expect: welcome to ckad
    match: contains
hints:
  - "`k -n ex-init logs app -c wait-for-deps`"
  - "`k -n ex-init create service clusterip payments-db --tcp=5432:5432` — a Service is a DNS name even with no Pods behind it."
  - "Generate `site` with `k -n ex-init run site --image=nginx:1.27 $do > site.yaml`, rename the container to `web`, then add `initContainers:` and `volumes:` (see the lesson)."
solution: |
  ```bash
  k -n ex-init logs app -c wait-for-deps          # waiting for payments-db
  k -n ex-init create service clusterip payments-db --tcp=5432:5432
  k -n ex-init get pod app -w                     # PodInitializing → Running
  ```

  ```yaml
  apiVersion: v1
  kind: Pod
  metadata:
    name: site
    namespace: ex-init
  spec:
    initContainers:
    - name: fetch
      image: busybox:1.36
      command: ["sh", "-c", "echo 'welcome to ckad' > /work/index.html"]
      volumeMounts:
      - name: html
        mountPath: /work
    containers:
    - name: web
      image: nginx:1.27
      volumeMounts:
      - name: html
        mountPath: /usr/share/nginx/html
    volumes:
    - name: html
      emptyDir: {}
  ```

  The init container only resolves a DNS name, so any Service called `payments-db` unblocks it — even
  without endpoints.
autotest:
  solve: |
    kubectl -n ex-init create service clusterip payments-db --tcp=5432:5432
    cat <<'YAML' | kubectl apply -f -
    apiVersion: v1
    kind: Pod
    metadata:
      name: site
      namespace: ex-init
    spec:
      initContainers:
      - name: fetch
        image: busybox:1.36
        command: ["sh", "-c", "echo 'welcome to ckad' > /work/index.html"]
        volumeMounts:
        - name: html
          mountPath: /work
      containers:
      - name: web
        image: nginx:1.27
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        emptyDir: {}
    YAML
    kubectl -n ex-init wait --for=condition=Ready pod/app pod/site --timeout=150s
