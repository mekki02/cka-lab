id: ckad-ex-cronjob
title: "Schedule it, then test it now"
module: ckad-workloads
lesson: ckad-jobs-cronjobs
kind: exercise
difficulty: intermediate
minutes: 12
order: 2
tags: [cronjobs, jobs, schedule]
namespaces: [ex-cron]
statement: |
  In namespace `ex-cron`:

  1. Create a CronJob `cleanup` that runs `busybox:1.36` with `sh -c 'echo removing expired sessions'`
     **every 10 minutes**. It must:
     - never start a run while the previous one is still running;
     - keep only **1** successful and **1** failed Job in its history;
     - stop each run after **30** seconds at most.
  2. Do not wait for the schedule: create a Job `cleanup-manual` **from the CronJob** and make sure it completes.
checks:
  - id: schedule
    description: cleanup runs every 10 minutes with busybox:1.36
    type: cluster
    command: kubectl -n ex-cron get cronjob cleanup -o jsonpath='{.spec.schedule}|{.spec.jobTemplate.spec.template.spec.containers[0].image}'
    expect: '^(\*/10|0,10,20,30,40,50|0-59/10) \* \* \* \*\|busybox:1\.36$'
    match: regex
  - id: concurrency
    description: Overlapping runs are forbidden
    type: cluster
    command: kubectl -n ex-cron get cronjob cleanup -o jsonpath='{.spec.concurrencyPolicy}'
    expect: Forbid
    match: exact
  - id: history
    description: History keeps 1 successful and 1 failed Job
    type: cluster
    command: kubectl -n ex-cron get cronjob cleanup -o jsonpath='{.spec.successfulJobsHistoryLimit}/{.spec.failedJobsHistoryLimit}'
    expect: 1/1
    match: exact
  - id: deadline
    description: Each run is limited to 30 seconds (activeDeadlineSeconds of the Job template)
    type: cluster
    command: kubectl -n ex-cron get cronjob cleanup -o jsonpath='{.spec.jobTemplate.spec.activeDeadlineSeconds}'
    expect: "30"
    match: number
  - id: manual-run
    description: Job cleanup-manual was created from the CronJob and completed
    type: cluster
    command: kubectl -n ex-cron get job cleanup-manual -o jsonpath='{.metadata.ownerReferences[0].kind}/{.metadata.ownerReferences[0].name} {.status.succeeded}'
    expect: CronJob/cleanup 1
    match: exact
  - id: output
    description: The manual run printed its message
    type: cluster
    command: kubectl -n ex-cron logs job/cleanup-manual
    expect: removing expired sessions
    match: contains
hints:
  - "Quote the schedule: `--schedule='*/10 * * * *'`."
  - "`activeDeadlineSeconds` limits a **Job**, so it goes under `spec.jobTemplate.spec`, next to `template:`. The two history limits and `concurrencyPolicy` go directly under the CronJob's `spec`."
  - "`k -n ex-cron create job cleanup-manual --from=cronjob/cleanup`"
solution: |
  ```bash
  k -n ex-cron create cronjob cleanup --image=busybox:1.36 --schedule='*/10 * * * *' $do \
    -- sh -c 'echo removing expired sessions' > cron.yaml
  vim cron.yaml
  ```

  ```yaml
  spec:
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 1
    schedule: '*/10 * * * *'
    jobTemplate:
      spec:
        activeDeadlineSeconds: 30
        template: …
  ```

  ```bash
  k apply -f cron.yaml
  k -n ex-cron create job cleanup-manual --from=cronjob/cleanup
  k -n ex-cron logs job/cleanup-manual
  ```

  A Job created with `--from=cronjob/…` is owned by the CronJob, so it counts in the history and is
  cleaned up with it.
autotest:
  solve: |
    kubectl -n ex-cron create cronjob cleanup --image=busybox:1.36 --schedule='*/10 * * * *' --dry-run=client -o yaml -- sh -c 'echo removing expired sessions' > /tmp/cron.yaml
    yq -i '.spec.concurrencyPolicy = "Forbid" | .spec.successfulJobsHistoryLimit = 1 | .spec.failedJobsHistoryLimit = 1 | .spec.jobTemplate.spec.activeDeadlineSeconds = 30' /tmp/cron.yaml
    kubectl apply -f /tmp/cron.yaml
    kubectl -n ex-cron create job cleanup-manual --from=cronjob/cleanup
    kubectl -n ex-cron wait --for=condition=complete job/cleanup-manual --timeout=120s
