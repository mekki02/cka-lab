id: kubectl-inspect-fast
title: "Answer questions about the cluster, fast"
module: exam-workflow
lesson: kubectl-essentials
kind: exercise
difficulty: intermediate
minutes: 12
order: 3
tags: [jsonpath, output]
namespaces: [ex-inventory]
setup: |
  kubectl -n ex-inventory create deployment cart --image=nginx:1.27 --replicas=2
  kubectl -n ex-inventory create deployment search --image=registry.k8s.io/e2e-test-images/agnhost:2.53 -- /agnhost netexec --http-port=8080
  kubectl -n ex-inventory create deployment worker --image=busybox:1.36 -- sleep 36000
  kubectl -n ex-inventory create secret generic api-key --from-literal=token=k8s-Is-Fun-4271
  kubectl -n ex-inventory rollout status deployment cart search worker --timeout=180s
statement: |
  Many exam tasks are questions — "which Pod…", "write the names of… to a file" — graded on the exact
  output. Practise the three shapes of answer in namespace `ex-inventory`:

  1. **A file.** Write every Deployment of the namespace and the image of its first container, one per
     line, as `name:image`, to `~/answers/images.txt`:

     ```text
     cart:nginx:1.27
     …
     ```

  2. **A value.** What is the IP address of the `worker` Pod? Enter it below.

  3. **Terminal output.** The Secret `api-key` holds a key `token`. Print its *decoded* value in your
     terminal, then validate while it is on screen.

  Use `-o jsonpath` (or `custom-columns`) — no copying by hand.
inputs:
  - id: worker-ip
    label: IP address of the worker Pod
    placeholder: 10.x.y.z
checks:
  - id: images-file
    description: ~/answers/images.txt lists every Deployment as name:image
    type: file
    path: answers/images.txt
    expectCommand: kubectl -n ex-inventory get deployments -o jsonpath='{range .items[*]}{.metadata.name}:{.spec.template.spec.containers[0].image}{"\n"}{end}'
    match: lines
  - id: worker-ip
    description: You found the worker Pod's IP
    type: answer
    input: worker-ip
    expectCommand: kubectl -n ex-inventory get pods -l app=worker -o jsonpath='{.items[0].status.podIP}'
  - id: token-shown
    description: Your terminal shows the decoded token
    type: terminal
    expect: k8s-Is-Fun-4271
  - id: decoded
    description: You decoded it with base64 -d
    type: history
    expect: 'base64 +(-d|--decode)'
hints:
  - "`{range .items[*]}…{\"\\n\"}{end}` prints one line per item. Inside it, `{.metadata.name}` and `{.spec.template.spec.containers[0].image}`."
  - "`k -n ex-inventory get pods -o wide` shows Pod IPs; `-l app=worker -o jsonpath='{.items[0].status.podIP}'` prints only the one you need."
  - "`k -n ex-inventory get secret api-key -o jsonpath='{.data.token}' | base64 -d`"
solution: |
  ```bash
  mkdir -p ~/answers
  k -n ex-inventory get deploy \
    -o jsonpath='{range .items[*]}{.metadata.name}:{.spec.template.spec.containers[0].image}{"\n"}{end}' > ~/answers/images.txt
  cat ~/answers/images.txt

  k -n ex-inventory get pods -l app=worker -o jsonpath='{.items[0].status.podIP}{"\n"}'

  k -n ex-inventory get secret api-key -o jsonpath='{.data.token}' | base64 -d; echo
  ```

  Secret values are base64-*encoded*, not encrypted: anyone who can `get` a Secret can read it.
autotest:
  solve: |
    mkdir -p ~/answers
    kubectl -n ex-inventory get deploy -o jsonpath='{range .items[*]}{.metadata.name}:{.spec.template.spec.containers[0].image}{"\n"}{end}' > ~/answers/images.txt
    kubectl -n ex-inventory get secret api-key -o jsonpath='{.data.token}' | base64 -d; echo
  answers:
    worker-ip: "$(kubectl -n ex-inventory get pods -l app=worker -o jsonpath='{.items[0].status.podIP}')"
