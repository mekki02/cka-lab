id: ckad-ex-secret
title: "Secrets in, secrets out"
module: ckad-configuration
lesson: ckad-secrets
kind: exercise
difficulty: beginner
minutes: 12
order: 1
tags: [secrets, base64, secretKeyRef]
namespaces: [ex-secrets]
setup: |
  cat <<'YAML' | kubectl apply -f -
  apiVersion: v1
  kind: Secret
  metadata:
    name: legacy-db
    namespace: ex-secrets
  type: Opaque
  data:
    username: YmlsbGluZw==
    password: VHIwdWI0ZG9yJjM=
  YAML
statement: |
  In namespace `ex-secrets`:

  1. A Secret `legacy-db` already exists. Nobody remembers its password: read it from the API and decode it.
  2. Create a Secret `api-token` with the key `token` and the value `tok-8f2b9c`.
  3. Create a Pod `client` (`busybox:1.36`, command `sleep 3600`) where:
     - the environment variable `API_TOKEN` comes from key `token` of `api-token`;
     - the Secret `legacy-db` is mounted **read-only** at `/etc/db`, so that the password is the file
       `/etc/db/password`.
inputs:
  - id: password
    label: The decoded password of legacy-db
checks:
  - id: password
    description: You decoded legacy-db's password
    type: answer
    input: password
    expect: Tr0ub4dor&3
    caseSensitive: true
  - id: token-secret
    description: Secret api-token holds token=tok-8f2b9c
    type: cluster
    command: kubectl -n ex-secrets get secret api-token -o jsonpath='{.data.token}' | base64 -d
    expect: tok-8f2b9c
    match: exact
  - id: env-ref
    description: API_TOKEN is wired with secretKeyRef
    type: cluster
    command: kubectl -n ex-secrets get pod client -o jsonpath='{.spec.containers[0].env[?(@.name=="API_TOKEN")].valueFrom.secretKeyRef.name}/{.spec.containers[0].env[?(@.name=="API_TOKEN")].valueFrom.secretKeyRef.key}'
    expect: api-token/token
    match: exact
  - id: env-value
    description: Inside client, API_TOKEN is set
    type: cluster
    command: kubectl -n ex-secrets exec client -- printenv API_TOKEN
    expect: tok-8f2b9c
    match: exact
  - id: mounted
    description: /etc/db/password contains the password
    type: cluster
    command: kubectl -n ex-secrets exec client -- cat /etc/db/password
    expect: Tr0ub4dor&3
    match: exact
  - id: read-only
    description: The Secret volume is mounted read-only
    type: cluster
    command: kubectl -n ex-secrets get pod client -o jsonpath='{.spec.containers[0].volumeMounts[?(@.mountPath=="/etc/db")].readOnly}'
    expect: "true"
    match: exact
hints:
  - "`k -n ex-secrets get secret legacy-db -o jsonpath='{.data.password}' | base64 -d; echo`"
  - "`k -n ex-secrets create secret generic api-token --from-literal=token=tok-8f2b9c`"
  - "Volume: `secret: {secretName: legacy-db}` (secretName, not name); mount with `readOnly: true`."
solution: |
  ```bash
  k -n ex-secrets get secret legacy-db -o jsonpath='{.data.password}' | base64 -d; echo
  k -n ex-secrets create secret generic api-token --from-literal=token=tok-8f2b9c
  ```

  ```yaml
  apiVersion: v1
  kind: Pod
  metadata:
    name: client
    namespace: ex-secrets
  spec:
    containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]
      env:
      - name: API_TOKEN
        valueFrom:
          secretKeyRef:
            name: api-token
            key: token
      volumeMounts:
      - name: db
        mountPath: /etc/db
        readOnly: true
    volumes:
    - name: db
      secret:
        secretName: legacy-db
  ```
autotest:
  solve: |
    kubectl -n ex-secrets get secret legacy-db -o jsonpath='{.data.password}' | base64 -d; echo
    kubectl -n ex-secrets create secret generic api-token --from-literal=token=tok-8f2b9c
    cat <<'YAML' | kubectl apply -f -
    apiVersion: v1
    kind: Pod
    metadata:
      name: client
      namespace: ex-secrets
    spec:
      containers:
      - name: client
        image: busybox:1.36
        command: ["sleep", "3600"]
        env:
        - name: API_TOKEN
          valueFrom:
            secretKeyRef:
              name: api-token
              key: token
        volumeMounts:
        - name: db
          mountPath: /etc/db
          readOnly: true
      volumes:
      - name: db
        secret:
          secretName: legacy-db
    YAML
    kubectl -n ex-secrets wait --for=condition=Ready pod/client --timeout=120s
  answers:
    password: Tr0ub4dor&3
