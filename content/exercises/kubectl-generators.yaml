id: kubectl-generators
title: "Generators first: a Pod and a CronJob in two minutes"
module: exam-workflow
lesson: kubectl-essentials
kind: exercise
difficulty: beginner
minutes: 8
order: 1
tags: [imperative, dry-run]
namespaces: [ex-tools]
statement: |
  In the exam, typing YAML from memory is the slowest way to create anything. Build both objects below
  with a **generator** (`kubectl run`, `kubectl create …`), editing generated YAML only where no flag exists.

  In namespace `ex-tools`:

  1. A Pod `probe`, image `busybox:1.36`, running `sleep 3600`, with the label `role=debug`.
  2. A CronJob `report`, image `busybox:1.36`, running `date` every 15 minutes, that keeps
     **2** successful Jobs in its history. There is no flag for that field: generate the YAML with
     `--dry-run=client -o yaml` (or `$do`), find the field with `kubectl explain`, add it, apply.

  ```bash
  k explain cronjob.spec | grep -i history
  ```
checks:
  - id: probe-image
    description: Pod probe runs busybox:1.36
    type: cluster
    command: kubectl -n ex-tools get pod probe -o jsonpath='{.spec.containers[0].image}'
    expect: busybox:1.36
    match: exact
  - id: probe-label
    description: Pod probe has the label role=debug
    type: cluster
    command: kubectl -n ex-tools get pod probe -o jsonpath='{.metadata.labels.role}'
    expect: debug
    match: exact
  - id: probe-sleep
    description: Pod probe runs sleep 3600
    type: cluster
    command: kubectl -n ex-tools get pod probe -o jsonpath='{.spec.containers[0].command} {.spec.containers[0].args}'
    expect: '"sleep",\s*"3600"'
    match: regex
  - id: cronjob
    description: "CronJob report: every 15 minutes, busybox:1.36, keeps 2 successful Jobs"
    type: cluster
    command: kubectl -n ex-tools get cronjob report -o jsonpath='{.spec.schedule}|{.spec.successfulJobsHistoryLimit}|{.spec.jobTemplate.spec.template.spec.containers[0].image}'
    expect: "*/15 * * * *|2|busybox:1.36"
    match: exact
  - id: dry-run
    description: You generated YAML with a client dry-run instead of writing it by hand
    type: history
    expect: '--dry-run=client|\$do\b'
hints:
  - "`kubectl run` takes `--labels` and, after `--`, the command: `k -n ex-tools run probe --image=busybox:1.36 --labels=role=debug -- sleep 3600`."
  - "`k -n ex-tools create cronjob report --image=busybox:1.36 --schedule='*/15 * * * *' $do -- date > report.yaml`, then add `successfulJobsHistoryLimit: 2` directly under `spec:`."
solution: |
  ```bash
  k -n ex-tools run probe --image=busybox:1.36 --labels=role=debug --restart=Never -- sleep 3600

  k -n ex-tools create cronjob report --image=busybox:1.36 --schedule='*/15 * * * *' $do -- date > report.yaml
  k explain cronjob.spec.successfulJobsHistoryLimit
  vim report.yaml          # under spec:  successfulJobsHistoryLimit: 2
  k apply -f report.yaml
  ```

  Quote the schedule: unquoted, the shell expands `*` into file names.
autotest:
  solve: |
    kubectl -n ex-tools run probe --image=busybox:1.36 --labels=role=debug --restart=Never -- sleep 3600
    kubectl -n ex-tools create cronjob report --image=busybox:1.36 --schedule='*/15 * * * *' --dry-run=client -o yaml -- date > /tmp/report.yaml
    yq -i '.spec.successfulJobsHistoryLimit = 2' /tmp/report.yaml
    kubectl apply -f /tmp/report.yaml
