id: arch-challenge-symptoms
title: "Challenge: the Pod nobody can place"
module: foundations-architecture
kind: challenge
difficulty: intermediate
minutes: 15
tags: [scheduler, troubleshooting]
namespaces: [ex-sched]
setup: |
  cat <<'YAML' | kubectl apply -f -
  apiVersion: apps/v1
  kind: Deployment
  metadata: { name: report, namespace: ex-sched }
  spec:
    replicas: 1
    selector: { matchLabels: { app: report } }
    template:
      metadata: { labels: { app: report } }
      spec:
        nodeSelector: { disktype: nvme-fast }
        containers:
          - name: report
            image: busybox:1.36
            command: ["sleep", "36000"]
  YAML
statement: |
  The Deployment `report` in `ex-sched` was applied an hour ago and its Pod is still `Pending`.

  1. Find out **which control plane component** is reporting the problem and **why**
     (`kubectl describe pod`, bottom of the output).
  2. Fix it so the Pod runs. No node has — or should get — the label the Pod asks for: the requirement
     was copied from another cluster. Fix the **Deployment**.
  3. Then map each symptom below to the component you would inspect first.
inputs:
  - id: reporter
    label: Which component wrote the event explaining why the Pod is Pending?
    kind: choice
    options:
      - { id: a, text: kubelet }
      - { id: b, text: kube-controller-manager }
      - { id: c, text: default-scheduler (kube-scheduler) }
      - { id: d, text: kube-apiserver }
  - id: refused
    label: "`kubectl get nodes` prints `The connection to the server 172.18.0.4:6443 was refused`. Inspect first:"
    kind: choice
    options:
      - { id: a, text: "kube-apiserver, on the control plane node (crictl, its logs)" }
      - { id: b, text: kube-scheduler }
      - { id: c, text: CoreDNS }
      - { id: d, text: The kubelet of a worker node }
  - id: no-rs
    label: "`kubectl scale deploy web --replicas=5` succeeds, but no Pods appear and the Deployment status never changes. Inspect first:"
    kind: choice
    options:
      - { id: a, text: kube-scheduler }
      - { id: b, text: kube-controller-manager }
      - { id: c, text: etcd }
      - { id: d, text: kube-proxy }
checks:
  - id: running
    description: The report Pod is Running
    type: cluster
    command: kubectl -n ex-sched get pods -l app=report --field-selector=status.phase=Running -o jsonpath='{.items[*].metadata.name}' | wc -w
    expect: "1"
    match: number
  - id: no-selector
    description: The Deployment no longer requires the nvme-fast label
    type: cluster
    command: kubectl -n ex-sched get deploy report -o jsonpath='{.spec.template.spec}' | grep -vq nvme-fast
    expect: nodeSelector removed
    match: success
  - id: reporter
    description: You identified who reported the scheduling failure
    type: answer
    input: reporter
    expect: c
  - id: refused
    description: "Symptom 1: API connection refused"
    type: answer
    input: refused
    expect: a
  - id: no-rs
    description: "Symptom 2: the spec is stored but nobody acts on it"
    type: answer
    input: no-rs
    expect: b
hints:
  - "`k -n ex-sched describe pod -l app=report | tail` — look at the `From` column of the `FailedScheduling` event."
  - "`k -n ex-sched edit deploy report` and delete the `nodeSelector` block, or use a JSON patch with `\"op\":\"remove\"`."
solution: |
  The event is `FailedScheduling` from **default-scheduler**: `0/N nodes are available: N node(s) didn't
  match Pod's node affinity/selector`. The Pod requires `disktype: nvme-fast`, which no node has.

  ```bash
  k -n ex-sched patch deploy report --type=json -p '[{"op":"remove","path":"/spec/template/spec/nodeSelector"}]'
  k -n ex-sched rollout status deploy report
  ```

  Symptoms:

  - **Connection refused on 6443** → the **kube-apiserver** is down (or etcd under it). kubectl cannot help:
    on the control plane node, `crictl ps -a | grep kube-apiserver` and `crictl logs <id>`.
  - **Stored but never reconciled** → **kube-controller-manager**: the API accepted the change, but no
    controller acts on it.
autotest:
  solve: |
    kubectl -n ex-sched patch deploy report --type=json -p '[{"op":"remove","path":"/spec/template/spec/nodeSelector"}]'
    kubectl -n ex-sched rollout status deploy report --timeout=120s
  answers: { reporter: c, refused: a, no-rs: b }
