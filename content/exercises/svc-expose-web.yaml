id: svc-expose-web
title: "Expose a Deployment and call it by name"
module: services
lesson: services-fundamentals
kind: exercise
difficulty: beginner
minutes: 8
order: 1
tags: [clusterip, dns]
namespaces: [ex-web]
setup: |
  kubectl -n ex-web create deployment web --image=nginx:1.27 --replicas=3
  kubectl -n ex-web run client --image=busybox:1.36 --restart=Never -- sleep 36000
  kubectl -n ex-web rollout status deployment web --timeout=180s
statement: |
  Namespace `ex-web` runs three `nginx` Pods (Deployment `web`) and a `client` Pod.

  1. Create a Service named `web` that listens on port **8080** and forwards to nginx's port **80**.
  2. Check that it has three endpoints.
  3. From the `client` Pod, fetch the page through the Service by name:
     `k -n ex-web exec client -- wget -qO- -T 3 web:8080`
  4. Enter the Service's ClusterIP below.
inputs:
  - id: cluster-ip
    label: ClusterIP of the web Service
    placeholder: 10.x.y.z
checks:
  - id: ports
    description: Service web maps port 8080 to target port 80
    type: cluster
    command: kubectl -n ex-web get svc web -o jsonpath='{.spec.type} {.spec.ports[0].port}->{.spec.ports[0].targetPort}'
    expect: ClusterIP 8080->80
    match: exact
  - id: endpoints
    description: The Service has 3 ready endpoints
    type: cluster
    command: kubectl -n ex-web get endpointslices -l kubernetes.io/service-name=web -o jsonpath='{range .items[*].endpoints[?(@.conditions.ready==true)]}{.addresses[0]}{"\n"}{end}' 2>/dev/null | grep -c .
    expect: "3"
    match: number
  - id: reachable
    description: The client gets the nginx page through web:8080
    type: cluster
    command: kubectl -n ex-web exec client -- wget -qO- -T 3 web:8080
    expect: Welcome to nginx!
    match: contains
  - id: cluster-ip
    description: You found the ClusterIP
    type: answer
    input: cluster-ip
    expectCommand: kubectl -n ex-web get svc web -o jsonpath='{.spec.clusterIP}'
hints:
  - "`k -n ex-web expose deployment web --port=8080 --target-port=80` — the selector is copied from the Deployment."
  - "`k -n ex-web get svc web` shows the CLUSTER-IP column."
solution: |
  ```bash
  k -n ex-web expose deployment web --port=8080 --target-port=80
  k -n ex-web get endpointslices -l kubernetes.io/service-name=web
  k -n ex-web exec client -- wget -qO- -T 3 web:8080 | head -4
  k -n ex-web get svc web -o jsonpath='{.spec.clusterIP}{"\n"}'
  ```

  `port` is what clients call; `targetPort` is where the container listens. Within the same namespace the
  short name `web` resolves; from another namespace use `web.ex-web`.
autotest:
  solve: |
    kubectl -n ex-web expose deployment web --port=8080 --target-port=80
    sleep 10
  answers:
    cluster-ip: "$(kubectl -n ex-web get svc web -o jsonpath='{.spec.clusterIP}')"
