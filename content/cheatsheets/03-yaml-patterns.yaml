id: yaml-patterns
title: YAML patterns
description: Fragments for the fields generators cannot set. Paste into a generated manifest and adjust.
order: 3
sections:
  - title: Containers
    entries:
      - title: Resources
        lang: yaml
        code: |
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
        tags: [resources, requests, limits]
      - title: Probes
        lang: yaml
        code: |
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 10
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
        tags: [probes, readiness, liveness]
      - title: Env from ConfigMap and Secret
        lang: yaml
        code: |
          env:
            - name: MODE
              valueFrom: { configMapKeyRef: { name: app, key: MODE } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db, key: password } }
          envFrom:
            - configMapRef: { name: app }
        tags: [env, configmap, secret]
      - title: Security context
        lang: yaml
        code: |
          securityContext:            # container level
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
        tags: [security]
  - title: Pod spec
    entries:
      - title: Volumes and mounts
        lang: yaml
        code: |
          containers:
            - name: app
              volumeMounts:
                - { name: config, mountPath: /etc/app, readOnly: true }
                - { name: cache, mountPath: /cache }
                - { name: data, mountPath: /data }
          volumes:
            - name: config
              configMap: { name: app }
            - name: cache
              emptyDir: { sizeLimit: 500Mi }
            - name: data
              persistentVolumeClaim: { claimName: data }
        tags: [volumes, pvc, configmap, emptydir]
      - title: Init container and native sidecar
        description: A native sidecar is an init container with restartPolicy Always (stable since v1.33).
        lang: yaml
        code: |
          initContainers:
            - name: wait-db
              image: busybox:1.36
              command: ["sh", "-c", "until nc -z db 5432; do sleep 2; done"]
            - name: log-shipper
              image: busybox:1.36
              restartPolicy: Always        # runs alongside the app containers
              command: ["sh", "-c", "tail -F /var/log/app/app.log"]
        tags: [init, sidecar]
      - title: Scheduling constraints
        lang: yaml
        code: |
          nodeSelector: { disk: ssd }
          tolerations:
            - { key: dedicated, operator: Equal, value: gpu, effect: NoSchedule }
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - { key: topology.kubernetes.io/zone, operator: In, values: [zone-a, zone-b] }
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector: { matchLabels: { app: web } }
                    topologyKey: kubernetes.io/hostname
        tags: [affinity, tolerations, nodeSelector]
  - title: Storage
    entries:
      - title: PersistentVolume (hostPath) and claim
        lang: yaml
        code: |
          apiVersion: v1
          kind: PersistentVolume
          metadata: { name: pv-1 }
          spec:
            capacity: { storage: 1Gi }
            accessModes: ["ReadWriteOnce"]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: manual
            hostPath: { path: /mnt/data }
          ---
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata: { name: data }
          spec:
            storageClassName: manual
            accessModes: ["ReadWriteOnce"]
            resources: { requests: { storage: 500Mi } }
        tags: [pv, pvc, storage]
      - title: StorageClass
        lang: yaml
        code: |
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: fast
            annotations: { storageclass.kubernetes.io/is-default-class: "false" }
          provisioner: rancher.io/local-path     # use the provisioner your cluster has
          reclaimPolicy: Delete
          volumeBindingMode: WaitForFirstConsumer
          allowVolumeExpansion: true
        tags: [storageclass]
  - title: Networking
    entries:
      - title: NetworkPolicy — default deny and one allow
        lang: yaml
        code: |
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata: { name: default-deny }
          spec:
            podSelector: {}
            policyTypes: ["Ingress", "Egress"]
          ---
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata: { name: api-from-frontend }
          spec:
            podSelector: { matchLabels: { app: api } }
            policyTypes: ["Ingress"]
            ingress:
              - from:
                  - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: web } }
                    podSelector: { matchLabels: { role: frontend } }   # same item = AND
                ports: [{ protocol: TCP, port: 8080 }]
        tags: [networkpolicy, netpol]
      - title: Allow DNS egress
        description: With an egress default deny, Pods cannot resolve names until you allow this.
        lang: yaml
        code: |
          egress:
            - to:
                - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
                  podSelector: { matchLabels: { k8s-app: kube-dns } }
              ports:
                - { protocol: UDP, port: 53 }
                - { protocol: TCP, port: 53 }
        tags: [networkpolicy, dns, egress]
      - title: Ingress
        lang: yaml
        code: |
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata: { name: web }
          spec:
            ingressClassName: nginx
            tls: [{ hosts: [shop.example.com], secretName: web-tls }]
            rules:
              - host: shop.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend: { service: { name: web, port: { number: 80 } } }
        tags: [ingress, tls]
      - title: Gateway API HTTPRoute
        lang: yaml
        code: |
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: { name: web }
          spec:
            parentRefs: [{ name: public-gateway, namespace: infra }]
            hostnames: [shop.example.com]
            rules:
              - matches: [{ path: { type: PathPrefix, value: /api } }]
                backendRefs: [{ name: api, port: 8080 }]
              - backendRefs: [{ name: web, port: 80 }]
        tags: [gateway, httproute]
