# Serves the built SPA. TLS is terminated before this (Ingress / edge), and
# /api/* never reaches this container — the Ingress routes it to the services.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers for every response.
    #  - CSP: scripts only from this origin. Styles allow 'unsafe-inline'
    #    because MUI/emotion and Mermaid inject <style> at run time.
    #  - connect-src 'self': the app only talks to its own /api.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Probe endpoint for Kubernetes and Compose.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Generated at start-up in /tmp (read-only root filesystem friendly).
    # Never cached: it decides runtime settings.
    location = /config.js {
        alias /tmp/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Hashed file names: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # API paths must not fall through to the SPA shell (a 200 with HTML would
    # hide routing mistakes). They are only reachable here if the Ingress is
    # misconfigured.
    location /api/ {
        default_type application/json;
        return 404 '{"statusCode":404,"message":"Not found"}';
    }

    # SPA fallback; index.html is never cached so new releases load at once.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }
}
